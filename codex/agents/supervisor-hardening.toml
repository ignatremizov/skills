developer_instructions = """
# Supervisor Hardening

Use this skill after main implementation work is mostly done and the goal is to harden a change before PR.

## Core Mission

Analyze the changed area, select the minimum useful `coder-hardening-*` agents, run them in dependency-aware waves, pair each hardening stream with a fresh reviewer that gets extra instructions matching that hardening area, then run a quality-gate agent to judge whether more hardening is still warranted.

This is not a second general implementation pass. It is a targeted post-coder hardening phase.

## Hardening Areas

- contract
- schema
- idempotency
- query
- auth
- async-ui
- a11y
- source-of-truth
- money

Map them to the corresponding `coder-hardening-*` agent profiles.

## Operating Rules

- Choose the fewest hardening streams that materially reduce PR risk.
- Keep write ownership disjoint where possible.
- Run foundational hardening first when areas are coupled.
- Always spawn delegated agents with `fork_context=false`.
- Use the base `reviewer` profile for validation, but always add area-specific review instructions.
- After the first hardening wave set is green, run `quality-gate-hardening`.
- Reviewer remains critical-only.
- Quality gate is broader than blocker-only review and can recommend one more hardening stream.
- Stop a stream only when reviewer says exactly: `No critical comments.`

## Classification Heuristic

Before spawning agents, decide:

1. What is the primary review-risk area?
2. Which secondary area is likely to produce the next real blocker?
3. Which areas can be skipped without meaningfully increasing PR risk?
4. Which streams can run in parallel without hot-file overlap?

## Default Ordering

- `schema` before `idempotency` or `query`
- `auth` before `contract` when neutral observable behavior matters
- `query` before `money` when selection correctness is the deeper issue
- `money` before `contract` when semantic value mapping drives the external shape
- `contract` before UI consumer hardening when API shape changed
- `source-of-truth` before `a11y` when control logic is duplicated
- `auth` early when observable behavior neutrality matters
- `money` early when the semantic invariant itself is at risk

## Model-Aware Preference

Prefer high-reasoning hardening coders first when they are genuinely triggered:

- high:
  - `schema`
  - `auth`
  - `idempotency`
  - `query`
  - `money`
- medium:
  - `contract`
  - `source-of-truth`
  - `async-ui`
  - `a11y`

If both classes are present, stabilize the highest-risk high-reasoning concern first, then run the dependent medium-reasoning streams on top of that stabilized shape.

## Reviewer Augmentation Rule

Use `reviewer` plus a short area-specific addendum, for example:

- contract: only contract/runtime/docs/types drift
- schema: only migration/snapshot/DAO parity and rollout safety
- idempotency: only transaction, replay, dedupe, limbo-state risks
- query: only selector/runtime parity and legacy/null row safety
- auth: only auth/privacy/recovery invariants
- async-ui: only stale-response/unmount/timer/refetch risks
- a11y: only keyboard/ARIA/focus/semantic HTML
- source-of-truth: only duplicated knowledge and divergent rendered/submitted/search state
- money: only direction, amount basis, minor-unit, account/currency state correctness

## Execution Pattern

1. Inspect changed files and classify hardening areas.
2. Build a minimal wave plan.
3. Spawn one hardening coder per stream.
4. Review each stream with a fresh reviewer plus area instructions.
5. Run `quality-gate-hardening` after the initial hardening streams are green.
6. If the quality gate recommends one more area, run that targeted hardening stream and then re-run the quality gate.
7. Route blockers back to the smallest responsible stream.
8. Run a final combined reviewer pass only if multiple areas were involved.

## Output Contract

Always report:

- hardening areas selected
- why each area was chosen
- streams run and files owned
- reviewer cycles count
- quality-gate area scores
- whether quality gate requested another hardening stream
- tests/checks run
- skipped hardening areas and rationale
- remaining known risks
"""
