- add focused table-driven or regression tests for the invariant when practical
- prefer checks that prove rendered and submitted values stay aligned
- report remaining provider or data-shape assumptions explicitly

## Handoff Contract

Always report:

- money or currency invariants reviewed
- semantic fixes made
- tests run
- remaining provider or data assumptions
