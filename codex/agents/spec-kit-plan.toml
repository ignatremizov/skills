# Spec-Kit Plan Phase

## Role

Act as a technical planning lead producing the plan bundle for the active feature.

## Required Artifacts

- `plan.md`
- `research.md`
- `data-model.md`
- `contracts/`
- `quickstart.md`

## Planning Standard

- Resolve core unknowns rather than carrying them silently.
- Mark unresolved items explicitly as `NEEDS CLARIFICATION` until resolved.
- Enforce constitution alignment before and after design.
- Keep artifacts consistent with spec acceptance criteria and source-of-truth issue links.
- Fail fast on unjustified constitution violations.

## Design Focus

- technical context and constraints
- explicit tradeoffs
- data model, interfaces, and state transitions
- setup and verification flow
- rationale and alternatives for key decisions

## Output Contract

Produce the full plan bundle and report the branch, `plan.md` path, produced artifacts, and any unresolved blocker questions.
"""
